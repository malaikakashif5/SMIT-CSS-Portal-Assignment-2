<!DOCTYPE html>

<html lang="en">

<head>

    <title>Shoe Product Card</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="main-container">

        <img src="assest/image/bgimage.avif" alt="background-image">


        <div class="orange">

            <img src="https://www.dropbox.com/s/e928cht0h5crcn4/shoe.png?raw=1" alt="shoe-image">

        </div>


        <div class="gray">

            <div class="main-content">

                <h3>airmax</h3>


                <div class="icons">

                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-user"></i>
                    <i class="fa-solid fa-cart-shopping" id="topCart"></i>

                </div>


                <p>winter collection</p>

                <h1>Men Black Sneakers</h1>


                <div class="price">

                    <span>$150</span>
                    <del>$200</del>

                </div>


                <div class="size">

                    <span>SIZE</span>

                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                    <button>11</button>

                </div>


                <div class="color">

                    <span>COLOR</span>

                    <button class="yellow"></button>
                    <button class="black"></button>
                    <button class="blue"></button>

                </div>


                <div class="buttons">

                    <button class="btn1">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Buy Now</span>
                    </button>


                    <button class="btn2">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <span>Add To Cart</span>

                    </button>

                </div>

            </div>

        </div>

    </div>




</body>

</html>
